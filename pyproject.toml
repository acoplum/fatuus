[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fatuus"
version = "0.1.0"
description = "Desconstrução de marcas sintéticas e humanização de texto (Python + Agno + React)"
readme = "README.md"
authors = [{ name = "Acoplum", email = "contato@acoplum.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Faixa fechada no major 2: toda suposição de API do Agno usada aqui
# (Workflow/Loop/StepOutput, AgentOS.get_app sobre base_app, RunStatus) foi
# verificada em 2.6.22 e só nela. Sem teto, o build do container resolvia
# agno 3.0.5 enquanto o host tinha 2.6.22 — a deriva que causou os dois
# incidentes de dependência da Task 8. Subir de major exige reverificar.
agno = [
    "agno>=2.6.22,<3",
]
serve = [
    "agno[os]>=2.6.22,<3",
    "google-genai>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10,<3",
    "ruff>=0.6,<1",
]

[project.scripts]
fatuus = "fatuus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Mantém o gate de lint estável entre versões do Ruff; modernizações (UP),
# importação (I) e regras de complexidade entram em uma decisão separada.
select = ["E4", "E7", "E9", "F"]
